<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>كابتن وسيم – خدمة توصيل</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .header {
      background: linear-gradient(135deg, #0077ff, #00b4d8);
      padding: 20px;
      text-align: center;
      color: #fff;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #ffdd57;
    }

    .header h2 {
      margin: 5px 0 0;
      font-size: 16px;
      opacity: 0.9;
    }

    .banner {
      background: #ffdd57;
      padding: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      color: #333;
    }

    .image-box {
      padding: 20px;
      text-align: center;
      background: #0f172a;
    }

    .text {
      padding: 18px;
      font-size: 15px;
      color: #444;
      line-height: 1.6;
    }

    .buttons {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      padding: 14px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      display: block;
      cursor: pointer;
    }

    .btn-location {
      background: #16a34a;
      color: #fff;
    }

    .btn-whatsapp {
      background: #25d366;
      color: #fff;
    }

    .btn-direct {
      background: #0ea5e9;
      color: #fff;
    }

    .note {
      text-align: center;
      padding: 10px 20px 20px;
      font-size: 13px;
      color: #666;
    }

    #loader {
      display: none;
      width: 40px;
      height: 40px;
      border: 5px solid #ddd;
      border-top: 5px solid #00b4d8;
      border-radius: 50%;
      margin: 15px auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>خدمة التوصيل</h1>
      <h2>اسم الكابتن : وسيم</h2>
      <h2>نوع الدراجة : كهربائية</h2>
    </div>

    <div class="banner">
      رجاء تزويدنا بموقعك للوصول السريع
    </div>

    <div id="loader"></div>

    <div class="image-box">
      <img src="cartoon Image.png" style="width:100%; border-radius:14px;">
    </div>

    <div class="text">
      اضغط على الزر أدناه لمشاركة موقعك الحالي، ليتم الوصول إليك بأسرع وقت ممكن.
    </div>

    <div class="buttons">

      <!-- زر إرسال الموقع إلى Google Sheet -->
      <button class="btn btn-direct" onclick="sendLocationToSheet()">
        📍 إرسال موقعي مباشرة
      </button>

      <button class="btn btn-location" onclick="sendLocationSMS()">
        📍 مشاركة موقعي الآن عبر SMS
      </button>

      <button class="btn btn-whatsapp" onclick="sendLocationWhatsApp()">
        <i class="fab fa-whatsapp" style="font-size:20px; margin-left:6px;"></i>
        إرسال موقعي عبر واتساب
      </button>

    </div>

    <div class="note">
      لن يتم إرسال موقعك إلا بعد موافقتك داخل هاتفك.
    </div>

  </div>

  <script>

    function showLoader() {
      document.getElementById("loader").style.display = "block";
    }

    function hideLoader() {
      document.getElementById("loader").style.display = "none";
    }

    /* زر إرسال الموقع إلى Google Sheet */
    function sendLocationToSheet() {
      showLoader();

      navigator.geolocation.getCurrentPosition(async (pos) => {
        hideLoader();

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

      await fetch("https://script.google.com/macros/s/AKfycbx340j_UYgq3IhlDtqMirBTfOn9IT6kGDYEhvjZd2pP6KRR2gz3T8AeY8k0OwFi0dmn/exec", {
  method: "POST",
  body: JSON.stringify({
    map_url: "https://www.google.com/maps?q=" + lat + "," + lon
  })
});

        alert("تم إرسال موقعك بنجاح ✔");
      },
      () => {
        hideLoader();
        alert("تعذر الحصول على الموقع. يرجى تفعيل GPS.");
      });
    }

    function sendLocationSMS() {
      showLoader();

      if (!navigator.geolocation) {
        alert("جهازك لا يدعم تحديد الموقع.");
        hideLoader();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          hideLoader();

          var lat = pos.coords.latitude;
          var lon = pos.coords.longitude;

          var phone = "963958267694";
          var link = "https://www.google.com/maps?q=" + lat + "," + lon;
          var message = " موقعك على الخريطة اضغط ارسال فقط : " + link;

          window.location.href = "sms:" + phone + "?body=" + encodeURIComponent(message);
        },
        function () {
          hideLoader();
          alert("تعذر الحصول على الموقع. يرجى تفعيل GPS.");
        }
      );
    }

    function sendLocationWhatsApp() {
      showLoader();

      if (!navigator.geolocation) {
        alert("جهازك لا يدعم تحديد الموقع.");
        hideLoader();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          hideLoader();

          var lat = pos.coords.latitude;
          var lon = pos.coords.longitude;

          var link = "https://www.google.com/maps?q=" + lat + "," + lon;
          var phone = "963958267694";
          var message = " موقعك على الخريطة اضغط ارسال فقط: " + link;

          window.location.href =
            "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
        },
        function () {
          hideLoader();
          alert("تعذر الحصول على الموقع. يرجى تفعيل GPS.");
        }
      );
    }

  </script>

</body>
</html>
