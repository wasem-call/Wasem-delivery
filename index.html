<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>كابتن وسيم – خدمة توصيل</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .header {
      background: linear-gradient(135deg, #0077ff, #00b4d8);
      padding: 20px;
      text-align: center;
      color: #fff;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #ffdd57;
    }

    .header h2 {
      margin: 5px 0 0;
      font-size: 16px;
      opacity: 0.9;
    }

    .banner {
      background: #ffdd57;
      padding: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      color: #333;
    }

    .image-box {
      padding: 20px;
      text-align: center;
      background: #0f172a;
    }

    .text {
      padding: 18px;
      font-size: 15px;
      color: #444;
      line-height: 1.6;
    }

    .buttons {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      padding: 14px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      display: block;
      cursor: pointer;
    }

    .btn-location {
      background: #16a34a;
      color: #fff;
    }

    .btn-whatsapp {
      background: #25d366;
      color: #fff;
    }

    .note {
      text-align: center;
      padding: 10px 20px 20px;
      font-size: 13px;
      color: #666;
    }

    @media (min-width: 768px) {
      body {
        padding-top: 40px;
      }
      .container {
        max-width: 520px;
      }
      .header h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>خدمة التوصيل</h1>
      <h2>اسم الكابتن : وسيم</h2>
      <h2>نوع الدراجة : كهربائية</h2>
    </div>

    <div class="banner">
      رجاء تزويدنا بموقعك للوصول السريع
    </div>

    <div class="image-box">
      <img src="cartoon Image.png" style="width:100%; border-radius:14px;">
    </div>

    <div class="text">
      اضغط على الزر أدناه لمشاركة موقعك الحالي، ليتم الوصول إليك بأسرع وقت ممكن.
    </div>

    <div class="buttons">
      <button class="btn btn-location" onclick="sendLocationSMS()">
        📍 مشاركة موقعي الآن عبر SMS
      </button>

      <a class="btn btn-whatsapp" href="https://wa.me/963958267694" target="_blank">
        💬 التواصل عبر واتساب
      </a>
    </div>

    <div class="note">
      لن يتم إرسال موقعك إلا بعد موافقتك داخل هاتفك.
    </div>

  </div>

  <script>
    function sendLocationSMS() {
      if (!navigator.geolocation) {
        alert("جهازك لا يدعم تحديد الموقع.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          var lat = pos.coords.latitude;
          var lon = pos.coords.longitude;

          var phone = "963958267694";
          var message = "موقعي هو: " + lat + "," + lon;

          window.location.href = "sms:" + phone + "?body=" + encodeURIComponent(message);
        },
        function () {
          alert("تعذر الحصول على الموقع. يرجى تفعيل GPS.");
        }
      );
    }
  </script>

</body>
</html>
