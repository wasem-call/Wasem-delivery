<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>كابتن وسيم – خدمة توصيل</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #2563eb;
      --primary-2: #06b6d4;
      --success: #16a34a;
      --wa: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1d4ed8 0%, transparent 60%),
                  radial-gradient(1000px 500px at 100% 0%, #0891b2 0%, transparent 55%),
                  linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .container {
      background: var(--card);
      width: 100%;
      max-width: 460px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
    }

    .header {
      background: linear-gradient(140deg, var(--primary), var(--primary-2));
      padding: 24px 20px 20px;
      text-align: center;
      color: #fff;
      position: relative;
    }

    .header::after {
      content: "";
      position: absolute;
      inset: auto -30% -40% -30%;
      height: 120px;
      background: rgba(255,255,255,0.14);
      filter: blur(14px);
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      color: #fef08a;
      letter-spacing: .3px;
      position: relative;
      z-index: 1;
    }

    .header h2 {
      margin: 6px 0 0;
      font-size: 15px;
      opacity: 0.96;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    .banner {
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }

    .image-box {
      padding: 10px;
      text-align: center;
      background: #0b1220;
    }

    .image-box img {
      width: calc(100% + 30px);
      margin: -15px;
      border-radius: 20px;
      display: block;
      box-shadow: 0 10px 26px rgba(0,0,0,0.35);
    }

    .text {
      padding: 18px 18px 10px;
      font-size: 15px;
      color: #334155;
      line-height: 1.6;
      text-align: center;
      font-weight: 500;
    }

    .buttons {
      padding: 12px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      border: none;
      padding: 14px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      box-shadow: 0 8px 18px rgba(2, 6, 23, 0.18);
    }

    .btn:active { transform: translateY(1px) scale(.995); }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.03); }

    .btn-location { background: linear-gradient(135deg, #16a34a, #22c55e); color: #fff; }
    .btn-whatsapp { background: linear-gradient(135deg, #16a34a, var(--wa)); color: #fff; }
    .btn-direct { background: linear-gradient(135deg, #0284c7, #06b6d4); color: #fff; }

    .note {
      text-align: center;
      padding: 2px 20px 18px;
      font-size: 12px;
      color: var(--muted);
    }

    #loader {
      display: none;
      width: 34px;
      height: 34px;
      border: 4px solid #dbeafe;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      margin: 12px auto;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 420px) {
      .container { border-radius: 20px; }
      .header h1 { font-size: 26px; }
      .header h2 { font-size: 14px; }
      .btn { font-size: 14px; padding: 13px 14px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>خدمة التوصيل</h1>
      <h2>اسم الكابتن: وسيم</h2>
      <h2>نوع الدراجة: كهربائية</h2>
    </div>

    <div class="banner">
      رجاءً زوّدنا بموقعك للوصول السريع
    </div>

    <div id="loader"></div>

    <div class="image-box">
      <img src="cartoon Image.png">
    </div>

    <div class="text">
      سيتم إرسال موقعك تلقائيًا بعد الموافقة.
    </div>

    <div class="buttons">

      <button class="btn btn-direct" onclick="sendNow()">
        📍 إرسال موقعي مباشرة
      </button>

      <button class="btn btn-location" onclick="sendLocationSMS()">
        📍 عبر SMS
      </button>

      <button class="btn btn-whatsapp" onclick="sendLocationWhatsApp()">
        <i class="fab fa-whatsapp"></i>
        واتساب
      </button>

    </div>

    <div class="note">
      لن يتم إرسال موقعك إلا بعد موافقتك.
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://ltjchzpzujchzwbgcgnt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0amNoenB6dWpjaHp3YmdjZ250Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3OTQ0OTksImV4cCI6MjA4OTM3MDQ5OX0.AY1BQp4z8-G8aZTFdHafmWvIkpsusE1RgaUhvIlHCtU";
    const SUPABASE_TABLE = "order";
    const GEO_OPTIONS = { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 };
    const REQUIRED_ACCURACY_METERS = 15;

    function showLoader() {
      document.getElementById("loader").style.display = "block";
    }

    function hideLoader() {
      document.getElementById("loader").style.display = "none";
    }

    // تشغيل تلقائي
    window.onload = function () {
      checkPermissionAndSend();
    };

    function getPositionOnce() {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, GEO_OPTIONS);
      });
    }

    async function getBestPosition(maxAttempts = 5) {
      let best = null;
      for (let i = 0; i < maxAttempts; i++) {
        const pos = await getPositionOnce();
        if (!best || pos.coords.accuracy < best.coords.accuracy) {
          best = pos;
        }
        if (best.coords.accuracy <= REQUIRED_ACCURACY_METERS) break;
      }
      return best;
    }

    function checkPermissionAndSend() {
      showLoader();

      if (!navigator.geolocation) {
        hideLoader();
        return;
      }

      navigator.permissions.query({ name: "geolocation" }).then(function (result) {

        if (result.state === "granted") {
          sendNow();

        } else if (result.state === "prompt") {
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              sendNow(pos);
            },
            function () {
              hideLoader();
            },
            GEO_OPTIONS
          );

        } else {
          hideLoader();
        }

      }).catch(function () {
        sendNow();
      });
    }

    async function sendNow(position) {
      if (!position) {
        try {
          position = await getBestPosition(5);
        } catch (_) {
          hideLoader();
          alert("تعذر تحديد الموقع. تأكد من تفعيل GPS ومنح الإذن.");
          return;
        }
      }
      if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "PUT_YOUR_SUPABASE_ANON_KEY_HERE") {
        hideLoader();
        alert("ضع SUPABASE_ANON_KEY داخل الملف أولاً");
        return;
      }

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const mapLink = "https://www.google.com/maps?q=" + lat + "," + lon;

      fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          Url: mapLink
        })
      }).then(async (response) => {
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText}`);
        }
        hideLoader();
        const accuracy = Math.round(position.coords.accuracy || 0);
        alert(`تم إرسال موقعك ✔`);
      }).catch((error) => {
        hideLoader();
        alert("فشل الإرسال: " + error.message);
        console.error(error);
      });
    }

    function sendLocationSMS() {
      navigator.geolocation.getCurrentPosition(function (pos) {
        var link = "https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude;
        window.location.href = "sms:963958267694?body=" + link;
      });
    }

    function sendLocationWhatsApp() {
      navigator.geolocation.getCurrentPosition(function (pos) {
        var link = "https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude;
        window.location.href = "https://wa.me/963958267694?text=" + link;
      });
    }

  </script>

</body>
</html>
